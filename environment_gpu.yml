name: machine_learning_with_python_core_gpu
channels:
  - conda-forge
dependencies:
  # Instructor-laptop configuration, based on the validated `pytorch` mamba
  # environment. This file is intentionally hardware-specific.
  - python=3.14
  - pytorch=2.13
  - pytorch-gpu=2.13
  - torchvision=0.28
  - cuda-version=12.9

  # Core numerical and machine-learning stack.
  - numpy
  - scipy
  - pandas
  - scikit-learn

  # Model interpretation and parameter-optimization examples.
  - lime
  - optuna

  # Notebook and visualization stack used by the core teaching material.
  - jupyterlab
  - matplotlib
  - bokeh
