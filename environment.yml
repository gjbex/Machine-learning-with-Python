name: machine_learning_with_python_core_cpu
channels:
  - conda-forge
dependencies:
  # Keep the participant environment CPU-only and usable across Linux,
  # macOS, and Windows. The metapackage prevents a CUDA build from being
  # selected merely because the solver detects GPU-related packages.
  - python=3.14
  - pytorch-cpu=2.13
  - torchvision=0.28

  # Core numerical and machine-learning stack.
  - numpy
  - scipy
  - pandas
  - scikit-learn

  # Model interpretation and parameter-optimization examples.
  - lime
  - hyperopt
  - bayesian-optimization

  # Notebook and visualization stack used by the core teaching material.
  - jupyterlab
  - matplotlib
  - bokeh
